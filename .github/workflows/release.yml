# Automated releases via Changesets.
#
# On every push to main this either:
#   (a) opens/updates a "Version Packages" PR that bumps the version and
#       rewrites CHANGELOG.md from accumulated .changeset/*.md notes, or
#   (b) if that PR was just merged, publishes to npm and tags a GitHub Release.
#
# Prerequisites:
#   1. Configure @vladbutacu/mission-control on npm with a trusted publisher for
#      VladButacu/mission-control using this release.yml workflow.
#   2. npm publish authenticates through GitHub Actions OIDC (id-token: write)
#      and generates provenance via NPM_CONFIG_PROVENANCE.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag commits and create GitHub Releases
      pull-requests: write # open the Version Packages PR
      id-token: write # npm trusted publishing and provenance (OIDC)
      actions: write # dispatch required checks on the Version Packages PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changesets needs full history to diff against published versions
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm install -g npm@11.21.3

      - name: Version Packages PR or publish
        id: version
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npx changeset version
          publish-script: npm run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # Pushes made with GITHUB_TOKEN do not start workflows, so the Version
      # Packages PR would never get its required checks. workflow_dispatch is
      # the documented exception: GITHUB_TOKEN may dispatch it, and the run's
      # check results attach to the PR head commit.
      - name: Dispatch required checks on the Version Packages PR
        if: steps.version.outputs['pr-number'] != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run ci.yml --ref changeset-release/main
          gh workflow run changeset-check.yml --ref changeset-release/main
